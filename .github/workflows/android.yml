name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: SQLite-Schematests
        run: python3 tools/schema_test.py -v 2>&1 | tee schema.log

      - name: Tests und Debug-APK
        run: |
          set -o pipefail
          ./gradlew test :app:assembleDebug --continue --stacktrace 2>&1 | tee build.log

      - name: Ergebnis in Branch ci-output ablegen
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log schema.log /tmp/out/ 2>/dev/null || true
          grep -E '^e: |^w: |FAILED|What went wrong|error:|Exception' build.log > /tmp/out/errors.txt 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/schemas && cp -r core/database/schemas/. /tmp/out/schemas/ 2>/dev/null || true
          find . -path '*/build/test-results/*' -name '*.xml' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/out/RESULT.txt
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "lifeos-ci"
          git config user.email "ci@lifeos.local"
          git add -A
          git commit -q -m "CI ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Room-Schema erzeugen (Assets für MigrationTestHelper)
        run: ./gradlew :core:database:kspDebugKotlin --stacktrace

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests und Screenshots auf Emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            sleep 30
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew connectedDebugAndroidTest --continue --stacktrace > device.log 2>&1 || echo "TESTS_FAILED" >> device.log
            adb pull /sdcard/Download/lifeos-shots shots || true

      - name: Ergebnis in Branch ci-device ablegen
        if: always()
        run: |
          mkdir -p /tmp/dev
          cp device.log /tmp/dev/ 2>/dev/null || true
          grep -E '^e: |FAILED|What went wrong|Exception|AssertionError|TESTS_FAILED' device.log > /tmp/dev/errors.txt 2>/dev/null || true
          cp -r shots /tmp/dev/ 2>/dev/null || true
          find . -path '*/outputs/androidTest-results/connected/*' -name '*.xml' -exec cp {} /tmp/dev/ \; 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/dev/RESULT.txt
          cd /tmp/dev
          git init -q -b ci-device
          git config user.name "lifeos-ci"
          git config user.email "ci@lifeos.local"
          git add -A
          git commit -q -m "Device ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-device
